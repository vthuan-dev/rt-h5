version: "3.9"

services:
  fe:
    build:
      context: ./fe
    restart: unless-stopped

  be:
    build:
      context: ./be
    env_file:
      - ./be/.env
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rt_db
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fe
      - be
    restart: unless-stopped

volumes:
  mysql_data:
