name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rt_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            fe/package-lock.json
            be/package-lock.json

      - name: Install FE deps
        run: npm ci
        working-directory: fe

      - name: Build FE
        run: npm run build
        working-directory: fe

      - name: Install BE deps
        run: npm ci
        working-directory: be

      - name: Prepare BE env
        run: |
          cat > .env <<'EOF'
          PORT=4000
          FRONTEND_ORIGIN=http://127.0.0.1:8081
          JWT_SECRET=super-secret-key-for-ci
          REFRESH_TOKEN_DAYS=14
          AUTH_RATE_LIMIT_WINDOW_MS=60000
          AUTH_RATE_LIMIT_MAX=10
          WALLET_RATE_LIMIT_WINDOW_MS=60000
          WALLET_RATE_LIMIT_MAX=30
          ADMIN_API_KEY=admin-secret-key-ci
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/rt_db
          EOF
        working-directory: be

      - name: Run DB migrations
        run: npx prisma migrate deploy
        working-directory: be

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: be

      - name: Build BE
        run: npm run build
        working-directory: be
